services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${SWITCHYARD_POSTGRES_DB:-switchyard}
      POSTGRES_USER: ${SWITCHYARD_POSTGRES_USER:-switchyard}
      POSTGRES_PASSWORD: ${SWITCHYARD_POSTGRES_PASSWORD:-switchyard-local-only}
    ports:
      - "${SWITCHYARD_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - switchyard-postgres:/var/lib/postgresql

volumes:
  switchyard-postgres:
