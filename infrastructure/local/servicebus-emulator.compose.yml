services:
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - ./servicebus-emulator-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "${SWITCHYARD_SERVICEBUS_PORT:-5672}:5672"
      - "${SWITCHYARD_SERVICEBUS_HTTP_PORT:-5300}:5300"
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: "${SWITCHYARD_SERVICEBUS_SQL_PASSWORD:-not-configured}"
      ACCEPT_EULA: "${SWITCHYARD_SERVICEBUS_ACCEPT_EULA:-N}"
      EMULATOR_HTTP_PORT: 5300
    depends_on:
      - servicebus-sql
    networks:
      - switchyard-servicebus

  servicebus-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "${SWITCHYARD_SERVICEBUS_ACCEPT_EULA:-N}"
      MSSQL_SA_PASSWORD: "${SWITCHYARD_SERVICEBUS_SQL_PASSWORD:-not-configured}"
    networks:
      - switchyard-servicebus

networks:
  switchyard-servicebus:
